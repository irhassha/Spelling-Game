<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naya & Diba Spelling Bee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pink: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --purple: #a55eea;
      --yellow: #ffa502;
      --tile-unplaced: #70a1ff;
      --text-dark: #2f3542;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      background-color: var(--bg-pink);
      background-image: 
        radial-gradient(#ffd1dc 18%, transparent 19%),
        radial-gradient(#dff9fb 18%, transparent 19%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      padding: 28px 22px;
      border-radius: 28px;
      box-shadow: 0 14px 30px rgba(255, 107, 129, 0.15);
      border: 4px solid #ffeaa7;
      width: 100%;
      max-width: 490px;
      text-align: center;
      position: relative;
    }

    .container::before {
      content: "🎀";
      position: absolute;
      top: -16px;
      left: 20px;
      font-size: 28px;
    }

    .container::after {
      content: "✨";
      position: absolute;
      top: -14px;
      right: 20px;
      font-size: 24px;
    }

    .header-tag {
      display: inline-block;
      background: #ffeaa7;
      color: #d35400;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 14px 0;
      color: #ff4757;
      font-size: 25px;
    }

    /* Area Pengaturan List Kata */
    .setup-box {
      background: #fff;
      border: 2px dashed #ffccd5;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .setup-box label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #57606f;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px 12px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      font-size: 15px;
      resize: none;
      outline: none;
      text-transform: uppercase;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .setup-hint {
      font-size: 12px;
      color: #8395a7;
      margin-top: 4px;
    }

    /* Indikator Babak */
    .round-badge {
      display: inline-block;
      background: #c7ecee;
      color: #0984e3;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* Kartu Kata Tersembunyi */
    .word-preview-card {
      background: #f1f2f6;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      color: #2f3542;
    }

    .lock-hint-btn {
      background: #dfe4ea;
      color: #57606f;
      border: none;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 #ced6e0;
    }

    .lock-hint-btn:hover {
      background: #ced6e0;
    }

    /* Tombol Suara */
    .voice-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #d63031;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d63031;
    }

    .audio-btn {
      background: var(--yellow);
      box-shadow: 0 4px 0 #e67e22;
      font-size: 14px;
      padding: 10px 14px;
    }

    .speech-btn {
      background: #1dd1a1;
      box-shadow: 0 4px 0 #10ac84;
      font-size: 14px;
      padding: 10px 16px;
    }

    .speech-btn.listening {
      background: #ff4757;
      box-shadow: 0 4px 0 #c0392b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Kotak Jawaban */
    .answer-box {
      min-height: 75px;
      border: 3px dashed #c7ecee;
      border-radius: 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: #f7fbfb;
    }

    /* Balok Pilihan */
    .tiles-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 55px;
    }

    .hidden-pool-box {
      background: #f1f2f6;
      border: 2px dashed #dcdde1;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tile {
      width: 48px;
      height: 48px;
      background: var(--tile-unplaced);
      color: white;
      font-size: 21px;
      font-weight: 700;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e90ff;
      user-select: none;
      transition: all 0.15s ease;
    }

    .tile:hover {
      transform: translateY(-3px) scale(1.06);
    }

    .tile.placed {
      background: var(--purple);
      box-shadow: 0 4px 0 #6c5ce7;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .actions button.reset {
      background: #a4b0be;
      box-shadow: 0 4px 0 #747d8c;
    }

    .actions button.next {
      background: #2ed573;
      box-shadow: 0 4px 0 #26af5f;
    }

    .message {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 700;
      min-height: 24px;
      line-height: 1.4;
    }

    .message.correct { color: #2ed573; }
    .message.wrong { color: #ff4757; }
    .message.info { color: #0984e3; }

    /* MODAL VERIFIKASI ORANG TUA */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      padding: 24px 20px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border: 4px solid #ffccd5;
    }

    .modal-card h3 {
      margin: 0 0 10px 0;
      color: #2f3542;
      font-size: 20px;
    }

    .math-question {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin: 12px 0;
      letter-spacing: 1px;
    }

    .modal-input {
      width: 140px;
      padding: 10px;
      font-size: 20px;
      text-align: center;
      border: 2px solid #ced6e0;
      border-radius: 12px;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .modal-actions button.cancel {
      background: #a4b0be;
      box-shadow: 0 4px 0 #747d8c;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-tag">SERU & PINTAR</div>
    <h1>🌸 Naya & Diba Spelling Bee 🐝</h1>

    <!-- Panel Setup Daftar Kata -->
    <div class="setup-box" id="setupBox">
      <label for="wordListInput">📝 Masukkan Kata (Maks. 10 Kata):</label>
      <textarea id="wordListInput" placeholder="Contoh:&#10;CAT&#10;BOOK&#10;APPLE&#10;ORANGE">CAT
BOOK
APPLE
PENCIL</textarea>
      <div class="setup-hint">Pisahkan tiap kata dengan baris baru atau koma.</div>
      <button onclick="initWordList()" style="width: 100%; margin-top: 10px;">🚀 Mulai Permainan!</button>
    </div>

    <!-- Area Permainan -->
    <div id="gameArea" style="display: none;">
      <div class="round-badge" id="roundBadge">Kata 1 dari 4</div>

      <!-- Preview Kata (Default Tersembunyi) -->
      <div class="word-preview-card">
        <span>Kata Rahasia: <span id="wordMask" style="letter-spacing: 3px;">••••••</span></span>
        <button type="button" class="lock-hint-btn" id="revealWordBtn" onclick="requestParentAccess('revealWord')">
          🔒 Buka Kata
        </button>
      </div>

      <div class="voice-bar">
        <button id="hearWordBtn" class="audio-btn" onclick="speakCurrentWord()">
          📢 Dengar Kata
        </button>
        <button id="speechSpellBtn" class="speech-btn" onclick="startOneShotSpelling()">
          ⚡ Eja Sekali Ucap
        </button>
      </div>

      <!-- Kotak Susunan Huruf Jawaban -->
      <div class="answer-box" id="answerBox">
        <span style="color: #a4b0be; font-size: 14px;">Gunakan suara untuk mengeja kata! 👇</span>
      </div>

      <!-- Balok Pilihan (Default Hidden) -->
      <div class="hidden-pool-box" id="hiddenPoolNotice">
        <span style="font-size: 13px; color: #57606f; font-weight: 600;">
          🔒 Balok huruf disembunyikan untuk melatih pendengaran.
        </span>
        <button type="button" class="lock-hint-btn" onclick="requestParentAccess('revealTiles')">
          🔒 Buka Balok Bantuan
        </button>
      </div>
      <div class="tiles-pool" id="tilesPool" style="display: none;"></div>

      <div class="actions">
        <button class="reset" onclick="resetCurrentTiles()">🔄 Ulangi</button>
        <button onclick="checkSpelling()">✨ Cek Jawaban</button>
        <button class="next" id="nextWordBtn" onclick="goToNextWord()" style="display: none;">Kata Berikutnya ➡️</button>
      </div>

      <div class="message" id="message"></div>
    </div>
  </div>

  <!-- MODAL KUNCI ORANG TUA (Parental Verification) -->
  <div class="modal-overlay" id="parentModal">
    <div class="modal-card">
      <h3>🛡️ Kunci Orang Tua</h3>
      <p style="font-size: 13px; color: #57606f; margin: 0;">Jawab soal matematika berikut untuk membuka:</p>
      
      <div class="math-question" id="mathQuestion">28 × 17 = ?</div>
      <input type="number" id="mathAnswerInput" class="modal-input" placeholder="Jawaban" />

      <div class="modal-actions">
        <button type="button" class="cancel" onclick="closeParentModal()">Batal</button>
        <button type="button" onclick="verifyParentAnswer()">Buka Kunci</button>
      </div>
      <div id="modalError" style="color: #ff4757; font-size: 13px; font-weight: 700; margin-top: 8px;"></div>
    </div>
  </div>

  <script>
    let wordList = [];
    let currentWordIndex = 0;
    let targetWord = "";
    let poolTiles = [];
    let placedTiles = [];

    // State visibilitas per ronde
    let isWordRevealed = false;
    let isTilesRevealed = false;

    // Data Verifikasi Ortu
    let expectedMathAnswer = 0;
    let pendingUnlockAction = "";

    let isListening = false;
    let recognizer = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const phoneticLetterMap = {
      'A': 'A', 'AY': 'A', 'EI': 'A', 'EH': 'A', 'EY': 'A',
      'B': 'B', 'BE': 'B', 'BEE': 'B', 'BI': 'B',
      'C': 'C', 'SEE': 'C', 'SEA': 'C', 'SI': 'C', 'CE': 'C',
      'D': 'D', 'DEE': 'D', 'DE': 'D', 'DI': 'D',
      'E': 'E', 'EE': 'E',
      'F': 'F', 'EF': 'F', 'EFF': 'F',
      'G': 'G', 'GEE': 'G', 'JI': 'G', 'GE': 'G',
      'H': 'H', 'AITCH': 'H', 'ACHE': 'H', 'HA': 'H',
      'I': 'I', 'EYE': 'I', 'AYE': 'I', 'AI': 'I',
      'J': 'J', 'JAY': 'J', 'JEI': 'J', 'JE': 'J',
      'K': 'K', 'KAY': 'K', 'KA': 'K',
      'L': 'L', 'EL': 'L', 'ELL': 'L',
      'M': 'M', 'EM': 'M',
      'N': 'N', 'EN': 'N',
      'O': 'O', 'OH': 'O', 'OW': 'O',
      'P': 'P', 'PEA': 'P', 'PEE': 'P', 'PI': 'P', 'PE': 'P',
      'Q': 'Q', 'CUE': 'Q', 'QUE': 'Q', 'KIU': 'Q',
      'R': 'R', 'ARE': 'R', 'AR': 'R', 'ER': 'R',
      'S': 'S', 'ESS': 'S', 'ES': 'S',
      'T': 'T', 'TEA': 'T', 'TEE': 'T', 'TI': 'T', 'TE': 'T',
      'U': 'U', 'YOU': 'U', 'YU': 'U',
      'V': 'V', 'VEE': 'V', 'VI': 'V', 'VE': 'V',
      'W': 'W',
      'X': 'X', 'EX': 'X', 'EKS': 'X',
      'Y': 'Y', 'WHY': 'Y', 'WAI': 'Y',
      'Z': 'Z', 'ZEE': 'Z', 'ZED': 'Z', 'ZET': 'Z'
    };

    const fillerWords = new Set([
      'LETTER', 'HURUF', 'PLEASE', 'TOLONG', 'DONG', 'THE', 'NEXT', 'DAN', 'AND'
    ]);

    function playCutePop(step = 0) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const baseFreq = 440 + (step * 50);
        osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; 
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Membaca daftar input kata hingga 10 kata
    function initWordList() {
      const rawText = document.getElementById('wordListInput').value;
      const tokens = rawText.split(/[\n,]+/).map(w => w.trim().toUpperCase().replace(/[^A-Z]/g, '')).filter(Boolean);

      if (tokens.length === 0) {
        alert("Masukkan minimal satu kata ya!");
        return;
      }

      // Ambil maksimal 10 kata
      wordList = tokens.slice(0, 10);
      currentWordIndex = 0;

      document.getElementById('setupBox').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';

      loadWordRound(currentWordIndex);
    }

    function loadWordRound(index) {
      targetWord = wordList[index];
      placedTiles = [];

      // DEFAULT: Sembunyikan balok & kata rahasia
      isWordRevealed = false;
      isTilesRevealed = false;

      updateWordMaskDisplay();

      document.getElementById('roundBadge').textContent = `Kata ${index + 1} dari ${wordList.length}`;
      document.getElementById('nextWordBtn').style.display = 'none';
      document.getElementById('message').textContent = '';

      // Balok pool disembunyikan
      document.getElementById('hiddenPoolNotice').style.display = 'flex';
      document.getElementById('tilesPool').style.display = 'none';

      // Siapkan data huruf
      poolTiles = targetWord.split('').map((char, i) => ({
        id: i,
        letter: char
      }));

      shuffleArray(poolTiles);
      renderTiles();
      speakCurrentWord();
    }

    function updateWordMaskDisplay() {
      const maskEl = document.getElementById('wordMask');
      const btn = document.getElementById('revealWordBtn');

      if (isWordRevealed) {
        maskEl.textContent = targetWord;
        maskEl.style.color = '#ff4757';
        btn.textContent = '🔓 Terbuka';
      } else {
        maskEl.textContent = '•'.repeat(targetWord.length);
        maskEl.style.color = '#2f3542';
        btn.textContent = '🔒 Buka Kata';
      }
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function speakCurrentWord() {
      if (targetWord) {
        speak(targetWord.toLowerCase());
      }
    }

    function renderTiles() {
      const pool = document.getElementById('tilesPool');
      const answerBox = document.getElementById('answerBox');

      pool.innerHTML = '';
      answerBox.innerHTML = '';

      poolTiles.forEach(tile => {
        const div = document.createElement('div');
        div.className = 'tile';
        div.textContent = tile.letter;
        div.onclick = () => selectTile(tile.id, true);
        pool.appendChild(div);
      });

      if (placedTiles.length === 0) {
        answerBox.innerHTML = '<span style="color: #a4b0be; font-size: 14px;">Gunakan suara untuk mengeja kata! 👇</span>';
      } else {
        placedTiles.forEach(tile => {
          const div = document.createElement('div');
          div.className = 'tile placed';
          div.textContent = tile.letter;
          div.title = "Ketuk untuk membatalkan";
          div.onclick = () => unselectTile(tile.id);
          answerBox.appendChild(div);
        });
      }
    }

    function selectTile(id, playVoice = true) {
      const index = poolTiles.findIndex(t => t.id === id);
      if (index !== -1) {
        const [tile] = poolTiles.splice(index, 1);
        placedTiles.push(tile);

        if (playVoice) {
          speak(tile.letter);
        } else {
          playCutePop(placedTiles.length);
        }

        renderTiles();

        if (placedTiles.length === targetWord.length) {
          setTimeout(checkSpelling, 300);
        }
      }
    }

    function unselectTile(id) {
      const index = placedTiles.findIndex(t => t.id === id);
      if (index !== -1) {
        const [tile] = placedTiles.splice(index, 1);
        poolTiles.push(tile);
        renderTiles();
      }
    }

    function resetCurrentTiles() {
      poolTiles = [...poolTiles, ...placedTiles];
      placedTiles = [];
      document.getElementById('message').textContent = '';
      renderTiles();
    }

    // SISTEM VERIFIKASI ORANG TUA (Perkalian Sulit)
    function requestParentAccess(action) {
      pendingUnlockAction = action;

      // Hasilkan perkalian 2 digit acak yang sulit ditebak anak
      const numA = Math.floor(Math.random() * 25) + 16; // 16 - 40
      const numB = Math.floor(Math.random() * 20) + 14; // 14 - 33
      expectedMathAnswer = numA * numB;

      document.getElementById('mathQuestion').textContent = `${numA} × ${numB} = ?`;
      document.getElementById('mathAnswerInput').value = '';
      document.getElementById('modalError').textContent = '';

      document.getElementById('parentModal').style.display = 'flex';
      document.getElementById('mathAnswerInput').focus();
    }

    function closeParentModal() {
      document.getElementById('parentModal').style.display = 'none';
      pendingUnlockAction = "";
    }

    function verifyParentAnswer() {
      const userAns = parseInt(document.getElementById('mathAnswerInput').value, 10);

      if (userAns === expectedMathAnswer) {
        // Jawaban Benar -> Buka Kunci
        if (pendingUnlockAction === 'revealWord') {
          isWordRevealed = true;
          updateWordMaskDisplay();
        } else if (pendingUnlockAction === 'revealTiles') {
          isTilesRevealed = true;
          document.getElementById('hiddenPoolNotice').style.display = 'none';
          document.getElementById('tilesPool').style.display = 'flex';
        }
        closeParentModal();
      } else {
        document.getElementById('modalError').textContent = 'Jawaban belum tepat! Akses ditolak.';
      }
    }

    // MODE EJA CEPAT SEKALI TARIKAN NAPAS
    function startOneShotSpelling() {
      if (!SpeechRecognition) {
        alert("Browser belum mendukung mic. Disarankan buka lewat Chrome.");
        return;
      }

      if (isListening) {
        stopSpellingMic();
        return;
      }

      isListening = true;
      const btn = document.getElementById('speechSpellBtn');
      btn.className = 'speech-btn listening';
      btn.textContent = '🔴 Sedang Mendengar...';

      const msg = document.getElementById('message');
      msg.className = 'message info';
      msg.textContent = `🎙️ Eja kata "${targetWord.length} huruf" langsung (misal: "B - O - O - K")...`;

      recognizer = new SpeechRecognition();
      recognizer.lang = 'en-US';
      recognizer.continuous = false;
      recognizer.interimResults = false;

      recognizer.onresult = (event) => {
        let transcript = event.results[0][0].transcript.toUpperCase();
        
        transcript = transcript
          .replace(/DOUBLE\s+U/g, 'W')
          .replace(/DOUBLE-U/g, 'W')
          .replace(/DOUBLEYOU/g, 'W');

        const tokens = transcript.match(/[A-Z]+/g) || [];
        const lettersToPlace = [];

        tokens.forEach(token => {
          if (fillerWords.has(token)) return;
          const letter = phoneticLetterMap[token] || (token.length === 1 ? token : null);
          if (letter) {
            lettersToPlace.push(letter);
          } else {
            token.split('').forEach(char => lettersToPlace.push(char));
          }
        });

        if (lettersToPlace.length > 0) {
          msg.textContent = `Tertangkap: ${lettersToPlace.join(' - ')}! Menyusun...`;
          animatePlacingLetters(lettersToPlace);
        } else {
          msg.className = 'message wrong';
          msg.textContent = 'Ejaan belum tertangkap jelas, coba lagi yuk!';
        }
      };

      recognizer.onerror = () => {
        msg.className = 'message wrong';
        msg.textContent = '❌ Suara tidak terdengar, silakan coba lagi.';
        stopSpellingMic();
      };

      recognizer.onend = () => {
        stopSpellingMic();
      };

      recognizer.start();
    }

    function animatePlacingLetters(letters) {
      let step = 0;
      function placeNext() {
        if (step >= letters.length) return;
        const char = letters[step];
        const matchTile = poolTiles.find(t => t.letter === char);

        if (matchTile) {
          selectTile(matchTile.id, false);
        }
        step++;
        if (step < letters.length) {
          setTimeout(placeNext, 130);
        }
      }
      placeNext();
    }

    function stopSpellingMic() {
      isListening = false;
      const btn = document.getElementById('speechSpellBtn');
      if (btn) {
        btn.className = 'speech-btn';
        btn.textContent = '⚡ Eja Sekali Ucap';
      }
      if (recognizer) {
        try { recognizer.abort(); } catch (e) {}
        recognizer = null;
      }
    }

    function checkSpelling() {
      stopSpellingMic();
      const msg = document.getElementById('message');

      if (placedTiles.length < targetWord.length) {
        msg.className = 'message wrong';
        msg.textContent = 'Lengkapi dulu semua hurufnya ya! 🐥';
        return;
      }

      const userWord = placedTiles.map(t => t.letter).join('');

      if (userWord === targetWord) {
        msg.className = 'message correct';
        msg.textContent = '🎉 Hore! Hebat sekali ejaanmu benar! 🌟';
        speak("Great job! That is correct! " + targetWord);

        // Tampilkan tombol lanjut jika masih ada kata tersisa
        if (currentWordIndex < wordList.length - 1) {
          document.getElementById('nextWordBtn').style.display = 'inline-block';
        } else {
          msg.textContent = '🏆 LUAR BIASA! Semua kata berhasil kamu selesaikan! 🌟';
        }
      } else {
        msg.className = 'message wrong';
        msg.textContent = '❌ Ups, susunannya masih belum tepat! Semangat ya! 💪';
        speak("Try again!");
      }
    }

    function goToNextWord() {
      currentWordIndex++;
      loadWordRound(currentWordIndex);
    }
  </script>
</body>
</html>
