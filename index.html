<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naya & Diba Spelling Bee</title>
  <!-- Font lucu dan membulat dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pink: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --purple: #a55eea;
      --yellow: #ffa502;
      --tile-unplaced: #70a1ff;
      --text-dark: #2f3542;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      background-color: var(--bg-pink);
      background-image: 
        radial-gradient(#ffd1dc 18%, transparent 19%),
        radial-gradient(#dff9fb 18%, transparent 19%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      padding: 28px 22px;
      border-radius: 28px;
      box-shadow: 0 14px 30px rgba(255, 107, 129, 0.15);
      border: 4px solid #ffeaa7;
      width: 100%;
      max-width: 480px;
      text-align: center;
      position: relative;
    }

    .container::before {
      content: "🎀";
      position: absolute;
      top: -16px;
      left: 20px;
      font-size: 28px;
    }

    .container::after {
      content: "✨";
      position: absolute;
      top: -14px;
      right: 20px;
      font-size: 24px;
    }

    .header-tag {
      display: inline-block;
      background: #ffeaa7;
      color: #d35400;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 16px 0;
      color: #ff4757;
      font-size: 25px;
    }

    .input-section {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 75px 12px 14px;
      border: 3px solid #ffccd5;
      border-radius: 20px;
      font-size: 16px;
      color: var(--text-dark);
      background: #fff;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    input:focus {
      border-color: var(--primary);
    }

    .input-actions {
      position: absolute;
      right: 8px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      box-shadow: none;
      line-height: 1;
    }

    .icon-btn:hover {
      transform: scale(1.2);
    }

    button {
      padding: 12px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #d63031;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d63031;
    }

    .voice-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .audio-btn {
      background: var(--yellow);
      box-shadow: 0 4px 0 #e67e22;
      font-size: 14px;
      padding: 10px 14px;
    }

    .speech-btn {
      background: #1dd1a1;
      box-shadow: 0 4px 0 #10ac84;
      font-size: 14px;
      padding: 10px 14px;
    }

    .speech-btn.listening {
      background: #ff4757;
      box-shadow: 0 4px 0 #c0392b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .answer-box {
      min-height: 75px;
      border: 3px dashed #c7ecee;
      border-radius: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: #f7fbfb;
    }

    .pool-control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 4px 10px 4px;
      font-size: 13px;
      font-weight: 700;
      color: #636e72;
    }

    .toggle-pool-btn {
      background: #74b9ff;
      box-shadow: 0 3px 0 #0984e3;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 14px;
    }

    .hidden-pool-notice {
      background: #dfe6e9;
      color: #636e72;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }

    .tiles-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 55px;
    }

    .tile {
      width: 48px;
      height: 48px;
      background: var(--tile-unplaced);
      color: white;
      font-size: 21px;
      font-weight: 700;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e90ff;
      user-select: none;
      transition: all 0.15s ease;
    }

    .tile:hover {
      transform: translateY(-3px) scale(1.06);
    }

    .tile.placed {
      background: var(--purple);
      box-shadow: 0 4px 0 #6c5ce7;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .actions button.reset {
      background: #a4b0be;
      box-shadow: 0 4px 0 #747d8c;
    }

    .message {
      margin-top: 16px;
      font-size: 15px;
      font-weight: 700;
      min-height: 24px;
      line-height: 1.4;
    }

    .message.correct { color: #2ed573; }
    .message.wrong { color: #ff4757; }
    .message.info { color: #0984e3; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-tag">SERU & PINTAR</div>
    <h1>🌸 Naya & Diba Spelling Bee 🐝</h1>

    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" id="wordInput" placeholder="Ketik / ucapkan kata..." />
        <div class="input-actions">
          <button type="button" class="icon-btn" onclick="listenForWordInput()" title="Bicara untuk isi kata">🎙️</button>
          <button type="button" id="toggleBtn" class="icon-btn" onclick="toggleWordVisibility()" title="Show/Hide Kata">👁️</button>
        </div>
      </div>
      <button onclick="startGame()">Mulai!</button>
    </div>

    <div class="voice-bar" id="voiceBar" style="display: none;">
      <button id="hearWordBtn" class="audio-btn" onclick="speakCurrentWord()">
        📢 Dengar Kata
      </button>
      <button id="speechSpellBtn" class="speech-btn" onclick="toggleVoiceSpelling()">
        🎤 Mode Eja Suara
      </button>
    </div>

    <div class="answer-box" id="answerBox">
      <span style="color: #a4b0be; font-size: 14px;">Ketuk huruf di bawah atau gunakan suara! 👇</span>
    </div>

    <div class="pool-control-bar" id="poolControlBar" style="display: none;">
      <span>Balok Pilihan:</span>
      <button type="button" id="toggleTilesBtn" class="toggle-pool-btn" onclick="toggleTilesVisibility()">
        🙈 Sembunyikan Balok
      </button>
    </div>

    <div class="hidden-pool-notice" id="hiddenPoolNotice">
      🔒 Balok disembunyikan! Ucapkan hurufnya langsung lewat mic.
    </div>

    <div class="tiles-pool" id="tilesPool"></div>

    <div class="actions" id="controlButtons" style="display: none;">
      <button class="reset" onclick="resetCurrentTiles()">🔄 Ulangi</button>
      <button onclick="checkSpelling()">✨ Cek Jawaban</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    let targetWord = "";
    let poolTiles = [];
    let placedTiles = [];
    let isWordVisible = true;
    let isTilesVisible = true;
    let isListeningSpelling = false;
    let continuousRecognizer = null;
    let consumedTokensCount = 0;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Pemetaan fonetik lafal huruf (Inggris & adaptasi Indonesia)
    const phoneticLetterMap = {
      'A': 'A', 'AY': 'A', 'EI': 'A', 'EH': 'A', 'EY': 'A',
      'B': 'B', 'BE': 'B', 'BEE': 'B', 'BI': 'B',
      'C': 'C', 'SEE': 'C', 'SEA': 'C', 'SI': 'C', 'CE': 'C',
      'D': 'D', 'DEE': 'D', 'DE': 'D', 'DI': 'D',
      'E': 'E', 'EE': 'E',
      'F': 'F', 'EF': 'F', 'EFF': 'F',
      'G': 'G', 'GEE': 'G', 'JI': 'G', 'GE': 'G',
      'H': 'H', 'AITCH': 'H', 'ACHE': 'H', 'HA': 'H',
      'I': 'I', 'EYE': 'I', 'AYE': 'I', 'AI': 'I',
      'J': 'J', 'JAY': 'J', 'JEI': 'J', 'JE': 'J',
      'K': 'K', 'KAY': 'K', 'KA': 'K',
      'L': 'L', 'EL': 'L', 'ELL': 'L',
      'M': 'M', 'EM': 'M',
      'N': 'N', 'EN': 'N',
      'O': 'O', 'OH': 'O', 'OW': 'O',
      'P': 'P', 'PEA': 'P', 'PEE': 'P', 'PI': 'P', 'PE': 'P',
      'Q': 'Q', 'CUE': 'Q', 'QUE': 'Q', 'KIU': 'Q', 'KYU': 'Q',
      'R': 'R', 'ARE': 'R', 'AR': 'R', 'ER': 'R',
      'S': 'S', 'ESS': 'S', 'ES': 'S',
      'T': 'T', 'TEA': 'T', 'TEE': 'T', 'TI': 'T', 'TE': 'T',
      'U': 'U', 'YOU': 'U', 'YU': 'U',
      'V': 'V', 'VEE': 'V', 'VI': 'V', 'VE': 'V',
      'W': 'W',
      'X': 'X', 'EX': 'X', 'EKS': 'X',
      'Y': 'Y', 'WHY': 'Y', 'WAI': 'Y',
      'Z': 'Z', 'ZEE': 'Z', 'ZED': 'Z', 'ZET': 'Z'
    };

    // Kata pengisi/tambahan yang otomatis dilewati
    const fillerWords = new Set([
      'LETTER', 'HURUF', 'PLEASE', 'TOLONG', 'DONG', 'THE', 'NEXT', 'DAN', 'AND', 'UH', 'UM'
    ]);

    // Efek audio pop halus via Web Audio API (tidak memicu umpan balik ke mic)
    function playCutePop() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.06);
      } catch (e) {}
    }

    function checkMicSupport() {
      const msg = document.getElementById('message');
      if (!SpeechRecognition) {
        msg.className = 'message wrong';
        msg.textContent = '❌ Browser ini belum mendukung mic. Disarankan buka lewat Chrome.';
        return false;
      }
      return true;
    }

    function toggleWordVisibility() {
      const input = document.getElementById('wordInput');
      const toggleBtn = document.getElementById('toggleBtn');
      isWordVisible = !isWordVisible;

      if (isWordVisible) {
        input.type = "text";
        toggleBtn.textContent = "🙈";
      } else {
        input.type = "password";
        toggleBtn.textContent = "👁️";
      }
    }

    function toggleTilesVisibility() {
      isTilesVisible = !isTilesVisible;
      const pool = document.getElementById('tilesPool');
      const notice = document.getElementById('hiddenPoolNotice');
      const btn = document.getElementById('toggleTilesBtn');

      if (isTilesVisible) {
        pool.style.display = 'flex';
        notice.style.display = 'none';
        btn.textContent = '🙈 Sembunyikan Balok';
      } else {
        pool.style.display = 'none';
        notice.style.display = 'block';
        btn.textContent = '👁️ Tampilkan Balok';
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; 
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function listenForWordInput() {
      if (!checkMicSupport()) return;

      const recognizer = new SpeechRecognition();
      recognizer.lang = 'en-US';
      const msg = document.getElementById('message');
      msg.className = 'message info';
      msg.textContent = '🎙️ Silakan ucapkan satu kata bahasa Inggris...';

      recognizer.onresult = (event) => {
        const spokenWord = event.results[0][0].transcript.trim().toUpperCase().replace(/[^A-Z]/g, '');
        if (spokenWord) {
          document.getElementById('wordInput').value = spokenWord;
          msg.textContent = `Kata: "${spokenWord}" terdeteksi! Klik 'Mulai'.`;
          speak(spokenWord);
        }
      };

      recognizer.onerror = () => {
        msg.className = 'message wrong';
        msg.textContent = '❌ Suara tidak tertangkap, coba ulangi lagi ya.';
      };

      recognizer.start();
    }

    function startGame() {
      const input = document.getElementById('wordInput');
      const rawWord = input.value.trim().toUpperCase();
      targetWord = rawWord.replace(/[^A-Z]/g, '');

      if (!targetWord) {
        alert("Silakan masukkan kata yang benar ya!");
        return;
      }

      isWordVisible = false;
      input.type = "password";
      document.getElementById('toggleBtn').textContent = "👁️";

      isTilesVisible = true;
      document.getElementById('tilesPool').style.display = 'flex';
      document.getElementById('hiddenPoolNotice').style.display = 'none';
      document.getElementById('toggleTilesBtn').textContent = '🙈 Sembunyikan Balok';

      stopVoiceSpelling();

      placedTiles = [];
      poolTiles = targetWord.split('').map((char, index) => ({
        id: index,
        letter: char
      }));

      shuffleArray(poolTiles);

      document.getElementById('voiceBar').style.display = 'flex';
      document.getElementById('poolControlBar').style.display = 'flex';
      document.getElementById('controlButtons').style.display = 'flex';
      document.getElementById('message').textContent = '';

      renderTiles();
      speakCurrentWord();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function speakCurrentWord() {
      if (targetWord) {
        speak(targetWord.toLowerCase());
      }
    }

    function renderTiles() {
      const pool = document.getElementById('tilesPool');
      const answerBox = document.getElementById('answerBox');

      pool.innerHTML = '';
      answerBox.innerHTML = '';

      poolTiles.forEach(tile => {
        const div = document.createElement('div');
        div.className = 'tile';
        div.textContent = tile.letter;
        div.onclick = () => selectTile(tile.id, true);
        pool.appendChild(div);
      });

      if (placedTiles.length === 0) {
        answerBox.innerHTML = '<span style="color: #a4b0be; font-size: 14px;">Ketuk huruf di bawah atau gunakan suara! 👇</span>';
      } else {
        placedTiles.forEach(tile => {
          const div = document.createElement('div');
          div.className = 'tile placed';
          div.textContent = tile.letter;
          div.title = "Ketuk untuk membatalkan";
          div.onclick = () => unselectTile(tile.id);
          answerBox.appendChild(div);
        });
      }
    }

    function selectTile(id, playVoiceSound = true) {
      const index = poolTiles.findIndex(t => t.id === id);
      if (index !== -1) {
        const [tile] = poolTiles.splice(index, 1);
        placedTiles.push(tile);

        if (playVoiceSound) {
          speak(tile.letter);
        } else {
          playCutePop();
        }

        renderTiles();

        if (placedTiles.length === targetWord.length) {
          stopVoiceSpelling();
          setTimeout(checkSpelling, 300);
        }
      }
    }

    function unselectTile(id) {
      const index = placedTiles.findIndex(t => t.id === id);
      if (index !== -1) {
        const [tile] = placedTiles.splice(index, 1);
        poolTiles.push(tile);
        renderTiles();
      }
    }

    function resetCurrentTiles() {
      poolTiles = [...poolTiles, ...placedTiles];
      placedTiles = [];
      consumedTokensCount = 0;
      document.getElementById('message').textContent = '';
      renderTiles();
    }

    // Resolusi token kata menjadi karakter huruf tunggal
    function resolveTokenToLetter(token) {
      const upper = token.trim().toUpperCase();
      if (phoneticLetterMap[upper]) {
        return phoneticLetterMap[upper];
      }
      if (/^[A-Z]$/.test(upper)) {
        return upper;
      }
      return null;
    }

    function toggleVoiceSpelling() {
      if (!checkMicSupport()) return;

      if (isListeningSpelling) {
        stopVoiceSpelling();
      } else {
        startContinuousVoiceEngine();
      }
    }

    // ENGINE SUARA UTAMA: Continuous + Interim Delta Tokenizer
    function startContinuousVoiceEngine() {
      isListeningSpelling = true;
      consumedTokensCount = 0;

      const btn = document.getElementById('speechSpellBtn');
      btn.className = 'speech-btn listening';
      btn.textContent = '🛑 Matikan Mic';

      const msg = document.getElementById('message');
      msg.className = 'message info';
      msg.textContent = '🎙️ Mic menyala terus! Ucapkan hurufnya langsung (misal: "B", "O", "O", "K")...';

      continuousRecognizer = new SpeechRecognition();
      continuousRecognizer.lang = 'en-US';
      continuousRecognizer.continuous = true;
      continuousRecognizer.interimResults = true;

      continuousRecognizer.onresult = (event) => {
        if (!isListeningSpelling) return;

        // Gabungkan transkrip yang sedang mengalir
        let rawAccumulated = "";
        for (let i = 0; i < event.results.length; i++) {
          rawAccumulated += event.results[i][0].transcript + " ";
        }

        // Normalisasi frasa umum anak-anak
        rawAccumulated = rawAccumulated
          .toUpperCase()
          .replace(/DOUBLE\s+U/g, 'W')
          .replace(/DOUBLE-U/g, 'W')
          .replace(/DOUBLEYOU/g, 'W')
          .replace(/LETTER\s+([A-Z])/g, '$1')
          .replace(/HURUF\s+([A-Z])/g, '$1');

        // Pisahkan menjadi deretan token kata
        const tokens = rawAccumulated.match(/[A-Z]+/g) || [];
        const isCurrentChunkFinal = event.results[event.results.length - 1].isFinal;

        // Proses token baru yang belum pernah dikonsumsi
        while (consumedTokensCount < tokens.length) {
          const token = tokens[consumedTokensCount];
          const isLastToken = (consumedTokensCount === tokens.length - 1);

          // 1. Lewati kata penghubung/pengisi
          if (fillerWords.has(token)) {
            consumedTokensCount++;
            continue;
          }

          // 2. Terjemahkan kata menjadi huruf
          const letter = resolveTokenToLetter(token);

          if (letter) {
            // Cari balok yang masih tersedia di area pilihan
            const matchTile = poolTiles.find(t => t.letter === letter);

            if (matchTile) {
              selectTile(matchTile.id, false);
              msg.className = 'message info';
              msg.textContent = `⚡ Huruf '${letter}' masuk! Lanjut eja berikutnya...`;
              consumedTokensCount++;

              if (placedTiles.length === targetWord.length) {
                return;
              }
            } else {
              // Huruf tidak ada di pool atau sudah dipakai
              msg.className = 'message wrong';
              msg.textContent = `⚠️ Huruf '${letter}' tidak ada / sudah dipakai.`;
              consumedTokensCount++;
            }
          } else {
            // Token belum dikenali: jika bukan token terakhir atau chunk sudah final, lewati
            if (!isLastToken || isCurrentChunkFinal) {
              consumedTokensCount++;
            } else {
              break;
            }
          }
        }
      };

      continuousRecognizer.onerror = (e) => {
        if (e.error === 'not-allowed') {
          msg.className = 'message wrong';
          msg.textContent = '❌ Izin mic ditolak sistem.';
          stopVoiceSpelling();
        }
      };

      // Hanya hidupkan ulang jika browser memutus sesi karena hening terlalu lama
      continuousRecognizer.onend = () => {
        if (isListeningSpelling) {
          consumedTokensCount = 0;
          try {
            continuousRecognizer.start();
          } catch (e) {}
        }
      };

      try {
        continuousRecognizer.start();
      } catch (e) {}
    }

    function stopVoiceSpelling() {
      isListeningSpelling = false;
      const btn = document.getElementById('speechSpellBtn');
      if (btn) {
        btn.className = 'speech-btn';
        btn.textContent = '🎤 Mode Eja Suara';
      }
      if (continuousRecognizer) {
        continuousRecognizer.onend = null;
        try {
          continuousRecognizer.abort();
        } catch (e) {}
        continuousRecognizer = null;
      }
    }

    function checkSpelling() {
      stopVoiceSpelling();
      const msg = document.getElementById('message');

      if (placedTiles.length < targetWord.length) {
        msg.className = 'message wrong';
        msg.textContent = 'Lengkapi dulu semua hurufnya ya! 🐥';
        return;
      }

      const userWord = placedTiles.map(t => t.letter).join('');

      if (userWord === targetWord) {
        msg.className = 'message correct';
        msg.textContent = '🎉 Hore! Hebat sekali ejaanmu benar! 🌟';
        speak("Great job! That is correct! " + targetWord);
      } else {
        msg.className = 'message wrong';
        msg.textContent = '❌ Ups, susunannya masih belum tepat! Semangat ya! 💪';
        speak("Try again!");
      }
    }
  </script>
</body>
</html>
